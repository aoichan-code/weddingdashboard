<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrasi Nikah - Wedding Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #fff1f2; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .nav-tab-active { background-color: #be123c; color: #ffffff; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(190, 18, 60, 0.2); }
        .nav-tab-inactive { color: #4b5563; background-color: #ffffff; }
        .nav-tab-inactive:hover { background-color: #ffe4e6; color: #9f1239; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-rose-200 selection:text-rose-900">

    <div id="app-screen" class="min-h-screen flex flex-col">
        <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-rose-100">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-rings-wedding text-rose-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-rose-900 font-serif">Wedding Planner</h1>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold bg-gray-100 hover:bg-rose-100 text-gray-700 hover:text-rose-700 px-3 py-2 rounded-xl transition">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            <nav class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-rose-100">
                <a href="index.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
                <a href="lamaran.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-heart"></i><span>Lamaran</span></a>
                <a href="nikahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-gem"></i><span>Nikahan</span></a>
                <a href="seserahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-gift"></i><span>Seserahan</span></a>
                <a href="administrasi.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-active"><i class="fa-solid fa-file-signature"></i><span>Administrasi Nikah</span></a>
                <a href="tamu.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-users"></i><span>List Tamu</span></a>
            </nav>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5 sticky top-20">
                        <h3 id="admin-form-title" class="text-base font-bold text-blue-900 mb-4 border-b border-gray-100 pb-2">Tambah Dokumen</h3>
                        <form id="admin-form" onsubmit="saveAdminItem(event)">
                            <input type="hidden" id="admin-id">
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Dokumen / Persyaratan</label>
                                <input type="text" id="admin-name" required placeholder="Misal: Surat Pengantar RT/RW / N1-N4" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori Persyaratan</label>
                                <select id="admin-category" required class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="Persyaratan Cowo">Persyaratan Cowo (Pria)</option>
                                    <option value="Persyaratan Cewe">Persyaratan Cewe (Wanita)</option>
                                    <option value="Dokumen Bersama">Dokumen Bersama / KUA</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Estimasi Biaya (Rp)</label>
                                <input type="number" id="admin-estimasi" placeholder="0" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Realisasi Biaya (Rp)</label>
                                <input type="number" id="admin-aktual" placeholder="0" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Keterangan / Tempat Pengurusan</label>
                                <input type="text" id="admin-note" placeholder="Misal: Kelurahan / Puskesmas / KUA" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="flex space-x-2">
                                <button type="submit" id="btn-save-admin" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Simpan</button>
                                <button type="button" id="btn-cancel-admin" onclick="resetAdminForm()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="md:col-span-2 space-y-4">
                    <div class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-rose-100 shadow-sm text-xs">
                        <button onclick="filterAdmin('semua')" id="filter-admin-semua" class="px-3 py-1.5 rounded-xl font-bold bg-blue-600 text-white">Semua</button>
                        <button onclick="filterAdmin('Persyaratan Cowo')" id="filter-admin-cowo" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-blue-50">Persyaratan Cowo</button>
                        <button onclick="filterAdmin('Persyaratan Cewe')" id="filter-admin-cewe" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-blue-50">Persyaratan Cewe</button>
                        <button onclick="filterAdmin('Dokumen Bersama')" id="filter-admin-bersama" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-blue-50">Dokumen Bersama</button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="font-bold text-gray-800">Daftar Dokumen Administrasi</h3>
                            <span id="admin-count-badge" class="text-xs bg-blue-100 text-blue-700 font-bold px-2.5 py-1 rounded-full">0 Dokumen</span>
                        </div>
                        <div id="admin-item-list" class="space-y-3">
                            <p class="text-center text-gray-400 py-8 text-sm">Memuat data...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let currentAdminFilter = 'semua';

        function renderPage() {
            const items = globalData.administrasi || {};
            const listContainer = document.getElementById('admin-item-list');
            listContainer.innerHTML = '';
            let count = 0;

            if (Object.keys(items).length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">Belum ada daftar administrasi.</p>';
            }

            for (const key in items) {
                const item = items[key];
                if (currentAdminFilter !== 'semua' && item.category !== currentAdminFilter) continue;
                count++;

                const div = document.createElement('div');
                div.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border transition-all duration-200 ${item.paid ? 'bg-blue-50/40 border-blue-200' : 'bg-white border-rose-100 hover:shadow-sm'}`;
                div.innerHTML = `
                    <div class="flex items-start sm:items-center space-x-3 flex-1 mb-2 sm:mb-0">
                        <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="toggleAdminPaid('${key}', this.checked)" class="w-5 h-5 mt-0.5 sm:mt-0 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                        <div>
                            <h4 class="font-semibold text-sm ${item.paid ? 'line-through text-gray-400' : 'text-gray-800'}">${item.name}</h4>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 mt-1">
                                <span class="bg-blue-100 px-2 py-0.5 rounded text-blue-700 font-medium">${item.category}</span>
                                <span><i class="fa-solid fa-bullseye text-blue-400 mr-1"></i>Est: ${formatRupiah(item.estimasi)}</span>
                                <span class="${item.paid ? 'text-emerald-700 font-semibold' : ''}"><i class="fa-solid fa-wallet text-emerald-500 mr-1"></i>Realisasi: ${formatRupiah(item.aktual)}</span>
                                ${item.note ? `<span class="italic text-gray-400">• ${item.note}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2 justify-end">
                        <button onclick="editAdminItem('${key}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteAdminItem('${key}')" class="text-red-600 hover:bg-red-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(div);
            }

            document.getElementById('admin-count-badge').innerText = `${count} Dokumen`;
        }

        function filterAdmin(filter) {
            currentAdminFilter = filter;
            const buttons = {
                'semua': 'filter-admin-semua',
                'Persyaratan Cowo': 'filter-admin-cowo',
                'Persyaratan Cewe': 'filter-admin-cewe',
                'Dokumen Bersama': 'filter-admin-bersama'
            };
            for (const key in buttons) {
                const btn = document.getElementById(buttons[key]);
                if (btn) {
                    btn.className = (key === filter) ? "px-3 py-1.5 rounded-xl font-bold bg-blue-600 text-white" : "px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-blue-50";
                }
            }
            renderPage();
        }

        function saveAdminItem(e) {
            e.preventDefault();
            const id = document.getElementById('admin-id').value || 'admin_' + Date.now();
            const existingItem = globalData.administrasi[id] || {};

            globalData.administrasi[id] = {
                id: id,
                name: document.getElementById('admin-name').value,
                category: document.getElementById('admin-category').value,
                estimasi: parseInt(document.getElementById('admin-estimasi').value) || 0,
                aktual: parseInt(document.getElementById('admin-aktual').value) || 0,
                note: document.getElementById('admin-note').value,
                paid: existingItem.paid || false
            };
            syncData();
            resetAdminForm();
        }

        function toggleAdminPaid(id, paidStatus) {
            if (globalData.administrasi[id]) {
                globalData.administrasi[id].paid = paidStatus;
                syncData();
            }
        }

        function editAdminItem(id) {
            const item = globalData.administrasi[id];
            if (item) {
                document.getElementById('admin-id').value = id;
                document.getElementById('admin-name').value = item.name || '';
                document.getElementById('admin-category').value = item.category || 'Persyaratan Cowo';
                document.getElementById('admin-estimasi').value = item.estimasi || 0;
                document.getElementById('admin-aktual').value = item.aktual || 0;
                document.getElementById('admin-note').value = item.note || '';

                document.getElementById('admin-form-title').innerText = "Edit Dokumen";
                document.getElementById('btn-save-admin').innerText = "Update";
                document.getElementById('btn-cancel-admin').classList.remove('hidden');
            }
        }

        function deleteAdminItem(id) {
            if (confirm('Yakin ingin menghapus dokumen ini?')) {
                delete globalData.administrasi[id];
                syncData();
            }
        }

        function resetAdminForm() {
            document.getElementById('admin-form').reset();
            document.getElementById('admin-id').value = '';
            document.getElementById('admin-form-title').innerText = "Tambah Dokumen";
            document.getElementById('btn-save-admin').innerText = "Simpan";
            document.getElementById('btn-cancel-admin').classList.add('hidden');
        }
    </script>
</body>
</html>
