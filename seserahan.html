<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seserahan - Wedding Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #fff1f2; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .nav-tab-active { background-color: #be123c; color: #ffffff; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(190, 18, 60, 0.2); }
        .nav-tab-inactive { color: #4b5563; background-color: #ffffff; }
        .nav-tab-inactive:hover { background-color: #ffe4e6; color: #9f1239; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-rose-200 selection:text-rose-900">

    <div id="app-screen" class="min-h-screen flex flex-col">
        <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-rose-100">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-rings-wedding text-rose-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-rose-900 font-serif">Wedding Planner</h1>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold bg-gray-100 hover:bg-rose-100 text-gray-700 hover:text-rose-700 px-3 py-2 rounded-xl transition">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            <nav class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-rose-100">
                <a href="index.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
                <a href="lamaran.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-heart"></i><span>Lamaran</span></a>
                <a href="nikahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-gem"></i><span>Nikahan</span></a>
                <a href="seserahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-active"><i class="fa-solid fa-gift"></i><span>Seserahan</span></a>
                <a href="administrasi.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-file-signature"></i><span>Administrasi Nikah</span></a>
                <a href="tamu.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-users"></i><span>List Tamu</span></a>
            </nav>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5 sticky top-20">
                        <h3 id="seserahan-form-title" class="text-base font-bold text-purple-900 mb-4 border-b border-gray-100 pb-2">Tambah Seserahan</h3>
                        <form id="seserahan-form" onsubmit="saveSeserahanItem(event)">
                            <input type="hidden" id="seserahan-id">
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Barang</label>
                                <input type="text" id="seserahan-name" required placeholder="Misal: Mukena Silk / Kemeja Kerja" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori Seserahan</label>
                                <select id="seserahan-category" required class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                                    <option value="Seserahan Cewe">Seserahan Cewe (Pria ke Wanita)</option>
                                    <option value="Seserahan Cowo">Seserahan Cowo (Angsul-angsul)</option>
                                    <option value="Seserahan Adat">Seserahan Adat / Tradisional</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Tema Warna / Merek</label>
                                <input type="text" id="seserahan-brand" placeholder="Misal: Wardah / Hitam-Gold" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Link Pembelian Online (Web/URL)</label>
                                <input type="url" id="seserahan-link" placeholder="https://shopee.co.id/..." class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Estimasi Harga (Rp)</label>
                                <input type="number" id="seserahan-estimasi" placeholder="0" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Realisasi Harga (Rp)</label>
                                <input type="number" id="seserahan-aktual" placeholder="0" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div class="flex space-x-2">
                                <button type="submit" id="btn-save-seserahan" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Simpan</button>
                                <button type="button" id="btn-cancel-seserahan" onclick="resetSeserahanForm()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="md:col-span-2 space-y-4">
                    <div class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-rose-100 shadow-sm text-xs">
                        <button onclick="filterSeserahan('semua')" id="filter-seserahan-semua" class="px-3 py-1.5 rounded-xl font-bold bg-purple-600 text-white">Semua</button>
                        <button onclick="filterSeserahan('Seserahan Cewe')" id="filter-seserahan-cewe" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-purple-50">Seserahan Cewe</button>
                        <button onclick="filterSeserahan('Seserahan Cowo')" id="filter-seserahan-cowo" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-purple-50">Seserahan Cowo</button>
                        <button onclick="filterSeserahan('Seserahan Adat')" id="filter-seserahan-adat" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-purple-50">Seserahan Adat</button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="font-bold text-gray-800">Daftar Barang Seserahan</h3>
                            <span id="seserahan-count-badge" class="text-xs bg-purple-100 text-purple-700 font-bold px-2.5 py-1 rounded-full">0 Barang</span>
                        </div>
                        <div id="seserahan-item-list" class="space-y-3">
                            <p class="text-center text-gray-400 py-8 text-sm">Memuat data...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let currentSeserahanFilter = 'semua';

        function renderPage() {
            const items = globalData.seserahan || {};
            const listContainer = document.getElementById('seserahan-item-list');
            listContainer.innerHTML = '';
            let count = 0;

            if (Object.keys(items).length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">Belum ada daftar seserahan.</p>';
            }

            for (const key in items) {
                const item = items[key];
                if (currentSeserahanFilter !== 'semua' && item.category !== currentSeserahanFilter) continue;
                count++;

                const div = document.createElement('div');
                div.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border transition-all duration-200 ${item.paid ? 'bg-purple-50/40 border-purple-200' : 'bg-white border-rose-100 hover:shadow-sm'}`;
                div.innerHTML = `
                    <div class="flex items-start sm:items-center space-x-3 flex-1 mb-2 sm:mb-0">
                        <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="toggleSeserahanPaid('${key}', this.checked)" class="w-5 h-5 mt-0.5 sm:mt-0 text-purple-600 rounded focus:ring-purple-500 cursor-pointer">
                        <div>
                            <h4 class="font-semibold text-sm ${item.paid ? 'line-through text-gray-400' : 'text-gray-800'}">${item.name}</h4>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 mt-1">
                                <span class="bg-purple-100 px-2 py-0.5 rounded text-purple-700 font-medium">${item.category}</span>
                                ${item.brand ? `<span class="bg-gray-100 px-2 py-0.5 rounded text-gray-600"><i class="fa-solid fa-palette text-purple-400 mr-1"></i>${item.brand}</span>` : ''}
                                ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="bg-purple-50 text-purple-700 hover:bg-purple-100 px-2 py-0.5 rounded font-semibold flex items-center transition"><i class="fa-solid fa-cart-shopping mr-1"></i>Beli Online <i class="fa-solid fa-arrow-up-right-from-square text-[9px] ml-1"></i></a>` : ''}
                                <span><i class="fa-solid fa-bullseye text-purple-400 mr-1"></i>Est: ${formatRupiah(item.estimasi)}</span>
                                <span class="${item.paid ? 'text-emerald-700 font-semibold' : ''}"><i class="fa-solid fa-wallet text-emerald-500 mr-1"></i>Realisasi: ${formatRupiah(item.aktual)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2 justify-end">
                        <button onclick="editSeserahanItem('${key}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteSeserahanItem('${key}')" class="text-red-600 hover:bg-red-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(div);
            }

            document.getElementById('seserahan-count-badge').innerText = `${count} Barang`;
        }

        function filterSeserahan(filter) {
            currentSeserahanFilter = filter;
            const buttons = {
                'semua': 'filter-seserahan-semua',
                'Seserahan Cewe': 'filter-seserahan-cewe',
                'Seserahan Cowo': 'filter-seserahan-cowo',
                'Seserahan Adat': 'filter-seserahan-adat'
            };
            for (const key in buttons) {
                const btn = document.getElementById(buttons[key]);
                if (btn) {
                    btn.className = (key === filter) ? "px-3 py-1.5 rounded-xl font-bold bg-purple-600 text-white" : "px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-purple-50";
                }
            }
            renderPage();
        }

        function saveSeserahanItem(e) {
            e.preventDefault();
            const id = document.getElementById('seserahan-id').value || 'seserahan_' + Date.now();
            const existingItem = globalData.seserahan[id] || {};
            let linkVal = document.getElementById('seserahan-link').value.trim();
            if (linkVal && !linkVal.startsWith('http://') && !linkVal.startsWith('https://')) linkVal = 'https://' + linkVal;

            globalData.seserahan[id] = {
                id: id,
                name: document.getElementById('seserahan-name').value,
                category: document.getElementById('seserahan-category').value,
                brand: document.getElementById('seserahan-brand').value,
                link: linkVal,
                estimasi: parseInt(document.getElementById('seserahan-estimasi').value) || 0,
                aktual: parseInt(document.getElementById('seserahan-aktual').value) || 0,
                paid: existingItem.paid || false
            };
            syncData();
            resetSeserahanForm();
        }

        function toggleSeserahanPaid(id, paidStatus) {
            if (globalData.seserahan[id]) {
                globalData.seserahan[id].paid = paidStatus;
                syncData();
            }
        }

        function editSeserahanItem(id) {
            const item = globalData.seserahan[id];
            if (item) {
                document.getElementById('seserahan-id').value = id;
                document.getElementById('seserahan-name').value = item.name || '';
                document.getElementById('seserahan-category').value = item.category || 'Seserahan Cewe';
                document.getElementById('seserahan-brand').value = item.brand || '';
                document.getElementById('seserahan-link').value = item.link || '';
                document.getElementById('seserahan-estimasi').value = item.estimasi || 0;
                document.getElementById('seserahan-aktual').value = item.aktual || 0;

                document.getElementById('seserahan-form-title').innerText = "Edit Seserahan";
                document.getElementById('btn-save-seserahan').innerText = "Update";
                document.getElementById('btn-cancel-seserahan').classList.remove('hidden');
            }
        }

        function deleteSeserahanItem(id) {
            if (confirm('Yakin ingin menghapus item seserahan ini?')) {
                delete globalData.seserahan[id];
                syncData();
            }
        }

        function resetSeserahanForm() {
            document.getElementById('seserahan-form').reset();
            document.getElementById('seserahan-id').value = '';
            document.getElementById('seserahan-form-title').innerText = "Tambah Seserahan";
            document.getElementById('btn-save-seserahan').innerText = "Simpan";
            document.getElementById('btn-cancel-seserahan').classList.add('hidden');
        }
    </script>
</body>
</html>
