<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tamu - Wedding Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #fff1f2; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .nav-tab-active { background-color: #be123c; color: #ffffff; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(190, 18, 60, 0.2); }
        .nav-tab-inactive { color: #4b5563; background-color: #ffffff; }
        .nav-tab-inactive:hover { background-color: #ffe4e6; color: #9f1239; }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-rose-200 selection:text-rose-900">

    <div id="app-screen" class="min-h-screen flex flex-col">
        <header class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-rose-100">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-rings-wedding text-rose-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-rose-900 font-serif">Wedding Planner</h1>
                </div>
                <button onclick="handleLogout()" class="text-xs font-semibold bg-gray-100 hover:bg-rose-100 text-gray-700 hover:text-rose-700 px-3 py-2 rounded-xl transition">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            <nav class="flex flex-wrap gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-rose-100">
                <a href="index.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
                <a href="lamaran.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-heart"></i><span>Lamaran</span></a>
                <a href="nikahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-gem"></i><span>Nikahan</span></a>
                <a href="seserahan.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-gift"></i><span>Seserahan</span></a>
                <a href="administrasi.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-inactive"><i class="fa-solid fa-file-signature"></i><span>Administrasi Nikah</span></a>
                <a href="tamu.html" class="flex-1 min-w-[120px] py-3 px-3 rounded-xl text-xs md:text-sm flex items-center justify-center space-x-2 nav-tab-active"><i class="fa-solid fa-users"></i><span>List Tamu</span></a>
            </nav>

            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1">
                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5 sticky top-20">
                        <h3 id="tamu-form-title" class="text-base font-bold text-rose-900 mb-4 border-b border-gray-100 pb-2">Tambah Tamu</h3>
                        <form id="tamu-form" onsubmit="saveTamuItem(event)">
                            <input type="hidden" id="tamu-id">
                            
                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Tamu / Keluarga</label>
                                <input type="text" id="tamu-name" required placeholder="Misal: Budi & Keluarga" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>

                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Dari Pihak</label>
                                <select id="tamu-pihak" required class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                                    <option value="Pihak Cewe">Pihak Cewe (Wanita)</option>
                                    <option value="Pihak Cowo">Pihak Cowo (Pria)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Alamat / Kota</label>
                                <input type="text" id="tamu-alamat" placeholder="Misal: Jl. Mawar No. 5 / Bandung" class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>

                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Estimasi Pax (Orang)</label>
                                <input type="number" id="tamu-pax" min="1" value="2" required class="w-full px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                            </div>

                            <div class="flex space-x-2">
                                <button type="submit" id="btn-save-tamu" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Simpan</button>
                                <button type="button" id="btn-cancel-tamu" onclick="resetTamuForm()" class="hidden bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="md:col-span-2 space-y-4">
                    <div id="tamu-pihak-summary" class="grid grid-cols-2 gap-3"></div>

                    <div class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-rose-100 shadow-sm text-xs">
                        <button onclick="filterPihak('semua')" id="filter-pihak-semua" class="px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white">Semua Pihak</button>
                        <button onclick="filterPihak('Pihak Cewe')" id="filter-pihak-cewe" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-rose-50">Pihak Cewe</button>
                        <button onclick="filterPihak('Pihak Cowo')" id="filter-pihak-cowo" class="px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-rose-50">Pihak Cowo</button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-rose-100 p-5">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                            <h3 class="font-bold text-gray-800">Daftar Tamu Undangan</h3>
                            <span id="tamu-count-badge" class="text-xs bg-rose-100 text-rose-700 font-bold px-2.5 py-1 rounded-full">0 Tamu</span>
                        </div>
                        <div id="tamu-item-list" class="space-y-3">
                            <p class="text-center text-gray-400 py-8 text-sm">Memuat data...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="firebase-config.js"></script>
    <script>
        let currentPihakFilter = 'semua';

        function renderPage() {
            const items = globalData.tamu || {};
            const listContainer = document.getElementById('tamu-item-list');
            const pihakSummaryContainer = document.getElementById('tamu-pihak-summary');
            listContainer.innerHTML = '';
            pihakSummaryContainer.innerHTML = '';

            let totalTamu = 0;
            let paxPihak = {
                'Pihak Cewe': 0,
                'Pihak Cowo': 0
            };

            for (const key in items) {
                const item = items[key];
                const paxVal = parseInt(item.pax) || 0;
                const pihakKey = item.pihak || 'Pihak Cewe';
                paxPihak[pihakKey] = (paxPihak[pihakKey] || 0) + paxVal;
            }

            pihakSummaryContainer.innerHTML = `
                <div class="bg-pink-50 p-3 rounded-xl border border-pink-100 text-center">
                    <span class="text-[10px] uppercase font-bold text-pink-600 block">Pihak Cewe</span>
                    <h5 class="text-base sm:text-lg font-bold text-pink-900">${paxPihak['Pihak Cewe']} Pax</h5>
                </div>
                <div class="bg-rose-50 p-3 rounded-xl border border-rose-100 text-center">
                    <span class="text-[10px] uppercase font-bold text-rose-600 block">Pihak Cowo</span>
                    <h5 class="text-base sm:text-lg font-bold text-rose-900">${paxPihak['Pihak Cowo']} Pax</h5>
                </div>
            `;

            if (Object.keys(items).length === 0) {
                listContainer.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">Belum ada daftar tamu.</p>';
            }

            for (const key in items) {
                const item = items[key];
                const itemPihak = item.pihak || 'Pihak Cewe';

                if (currentPihakFilter !== 'semua' && itemPihak !== currentPihakFilter) {
                    continue;
                }
                totalTamu++;

                const pihakBadgeColor = itemPihak === 'Pihak Cowo' ? 'bg-rose-100 text-rose-800' : 'bg-pink-100 text-pink-700';

                const div = document.createElement('div');
                div.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border transition-all duration-200 ${item.sent ? 'bg-emerald-50/40 border-emerald-200' : 'bg-white border-rose-100 hover:shadow-sm'}`;
                div.innerHTML = `
                    <div class="flex items-start sm:items-center space-x-3 flex-1 mb-2 sm:mb-0">
                        <input type="checkbox" ${item.sent ? 'checked' : ''} onchange="toggleTamuSent('${key}', this.checked)" class="w-5 h-5 mt-0.5 sm:mt-0 text-rose-600 rounded focus:ring-rose-500 cursor-pointer">
                        <div>
                            <div class="flex items-center space-x-2">
                                <h4 class="font-semibold text-sm ${item.sent ? 'text-gray-500' : 'text-gray-800'}">${item.name}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${pihakBadgeColor}">${itemPihak}</span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 mt-1">
                                ${item.alamat ? `<span class="text-gray-600"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${item.alamat}</span>` : ''}
                                <span><i class="fa-solid fa-users text-rose-400 mr-1"></i>${item.pax} Pax</span>
                                ${item.sent ? '<span class="text-emerald-600 font-semibold"><i class="fa-solid fa-check mr-1"></i>Undangan Terkirim</span>' : '<span class="text-amber-600"><i class="fa-solid fa-clock mr-1"></i>Belum dikirim</span>'}
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2 justify-end">
                        <button onclick="editTamuItem('${key}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteTamuItem('${key}')" class="text-red-600 hover:bg-red-50 p-2 rounded-lg text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(div);
            }

            document.getElementById('tamu-count-badge').innerText = `${totalTamu} Undangan`;
        }

        function filterPihak(filter) {
            currentPihakFilter = filter;
            const buttons = {
                'semua': 'filter-pihak-semua',
                'Pihak Cewe': 'filter-pihak-cewe',
                'Pihak Cowo': 'filter-pihak-cowo'
            };
            for (const key in buttons) {
                const btn = document.getElementById(buttons[key]);
                if (btn) {
                    btn.className = (key === filter) 
                        ? "px-3 py-1.5 rounded-xl font-bold bg-rose-600 text-white" 
                        : "px-3 py-1.5 rounded-xl font-medium bg-gray-100 text-gray-600 hover:bg-rose-50";
                }
            }
            renderPage();
        }

        function saveTamuItem(e) {
            e.preventDefault();
            const id = document.getElementById('tamu-id').value || 'tamu_' + Date.now();
            const existingItem = globalData.tamu[id] || {};

            globalData.tamu[id] = {
                id: id,
                name: document.getElementById('tamu-name').value,
                pihak: document.getElementById('tamu-pihak').value,
                alamat: document.getElementById('tamu-alamat').value,
                pax: parseInt(document.getElementById('tamu-pax').value) || 1,
                sent: existingItem.sent || false
            };
            syncData();
            resetTamuForm();
        }

        function toggleTamuSent(id, sentStatus) {
            if (globalData.tamu[id]) {
                globalData.tamu[id].sent = sentStatus;
                syncData();
            }
        }

        function editTamuItem(id) {
            const item = globalData.tamu[id];
            if (item) {
                document.getElementById('tamu-id').value = id;
                document.getElementById('tamu-name').value = item.name || '';
                document.getElementById('tamu-pihak').value = item.pihak || 'Pihak Cewe';
                document.getElementById('tamu-alamat').value = item.alamat || '';
                document.getElementById('tamu-pax').value = item.pax || 2;

                document.getElementById('tamu-form-title').innerText = "Edit Tamu";
                document.getElementById('btn-save-tamu').innerText = "Update";
                document.getElementById('btn-cancel-tamu').classList.remove('hidden');
            }
        }

        function deleteTamuItem(id) {
            if (confirm('Yakin ingin menghapus tamu ini?')) {
                delete globalData.tamu[id];
                syncData();
            }
        }

        function resetTamuForm() {
            document.getElementById('tamu-form').reset();
            document.getElementById('tamu-id').value = '';
            document.getElementById('tamu-pax').value = '2';
            document.getElementById('tamu-form-title').innerText = "Tambah Tamu";
            document.getElementById('btn-save-tamu').innerText = "Simpan";
            document.getElementById('btn-cancel-tamu').classList.add('hidden');
        }
    </script>
</body>
</html>
